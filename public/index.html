<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leash — spend firewall for AI shopping agents</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f2ee; --panel: #fffdf9; --ink: #1b1a17; --muted: #6b675f; --line: #e3ded4;
    --accent: #2b4eff; --ok: #12805c; --ok-bg: #e3f4ec; --warn: #a15c00; --warn-bg: #fdf0db;
    --bad: #b42318; --bad-bg: #fde8e6; --mono: 'IBM Plex Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 Inter, system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 18px 28px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  .logo { font-weight: 700; font-size: 20px; letter-spacing: -.02em; display: flex; align-items: center; gap: 8px; }
  .logo svg { width: 26px; height: 26px; }
  .tag { color: var(--muted); }
  .badges { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .badge { font: 12px var(--mono); padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); }
  .badge.live { border-color: var(--ok); color: var(--ok); }
  main { display: grid; grid-template-columns: 320px 1fr; gap: 20px; padding: 20px 28px; max-width: 1280px; margin: 0 auto; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; padding: 16px; } header { padding: 14px 16px; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 16px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 12px; font-weight: 600; }
  label.row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 8px 0; font-size: 14px; }
  input[type=number] { width: 86px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; font: 14px var(--mono); background: #fff; }
  .cats { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .cats label { font-size: 12px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 999px; cursor: pointer; user-select: none; }
  .cats input { display: none; }
  .cats label:has(input:checked) { background: var(--ink); color: #fff; border-color: var(--ink); }
  .meter { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 8px 0 4px; }
  .meter > div { height: 100%; background: var(--accent); transition: width .4s; }
  .small { font-size: 12px; color: var(--muted); }
  textarea { width: 100%; min-height: 64px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; font: inherit; resize: vertical; background: #fff; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
  .chip { font-size: 13px; padding: 5px 10px; border-radius: 999px; border: 1px dashed var(--line); background: transparent; cursor: pointer; color: var(--ink); }
  .chip:hover { border-color: var(--ink); }
  .actions { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  button.primary { background: var(--ink); color: #fff; border: 0; padding: 10px 18px; border-radius: 10px; font: 600 15px Inter, sans-serif; cursor: pointer; }
  button.primary:disabled { opacity: .5; cursor: wait; }
  .toggle { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
  .toggle input { accent-color: var(--bad); width: 16px; height: 16px; }
  .steps { display: grid; gap: 14px; }
  .step { display: grid; grid-template-columns: 34px 1fr; gap: 12px; }
  .num { width: 34px; height: 34px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font: 600 14px var(--mono); }
  .step h3 { margin: 4px 0 8px; font-size: 16px; }
  .src { font: 11px var(--mono); color: var(--muted); margin-left: 6px; font-weight: 400; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td, th { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
  th { font-size: 12px; color: var(--muted); font-weight: 500; }
  td.n { font-family: var(--mono); text-align: right; }
  .rationale { font-style: italic; color: var(--muted); margin-top: 8px; }
  .alert { border-left: 3px solid var(--bad); background: var(--bad-bg); padding: 10px 12px; border-radius: 6px; margin: 6px 0; font-size: 14px; }
  .alert q { font-family: var(--mono); font-size: 12.5px; display: block; margin-top: 4px; quotes: '“' '”'; }
  .okline { border-left: 3px solid var(--ok); background: var(--ok-bg); padding: 8px 12px; border-radius: 6px; font-size: 14px; margin: 6px 0; }
  .verdict { border-radius: 12px; padding: 16px; display: grid; gap: 10px; }
  .verdict.APPROVE { background: var(--ok-bg); } .verdict.ESCALATE { background: var(--warn-bg); } .verdict.BLOCK { background: var(--bad-bg); }
  .vhead { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .vword { font: 700 28px Inter, sans-serif; letter-spacing: -.02em; }
  .APPROVE .vword { color: var(--ok); } .ESCALATE .vword { color: var(--warn); } .BLOCK .vword { color: var(--bad); }
  .risk { font: 13px var(--mono); }
  .reasons { margin: 0; padding-left: 18px; font-size: 14px; }
  .reasons li.block::marker { color: var(--bad); } .reasons li.escalate::marker { color: var(--warn); }
  .sev { font: 600 11px var(--mono); text-transform: uppercase; margin-right: 6px; }
  .block .sev { color: var(--bad); } .escalate .sev { color: var(--warn); }
  #pay { max-width: 360px; }
  .sim-btn { width: 100%; padding: 12px; border-radius: 8px; border: 2px dashed var(--accent); background: #fff; color: var(--accent); font: 600 15px Inter, sans-serif; cursor: pointer; }
  .ledger-row { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .ledger-row span:last-child { font-family: var(--mono); }
  .empty { color: var(--muted); font-size: 14px; }
  .err { color: var(--bad); font-size: 14px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <div class="logo">
    <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 26c6-2 10-8 10-14a6 6 0 1 1 12 0"/><circle cx="6" cy="26" r="3" fill="currentColor"/></svg>
    Leash
  </div>
  <span class="tag">Spend firewall for AI shopping agents</span>
  <div class="badges" id="badges"></div>
</header>

<main>
  <aside>
    <section class="card">
      <h2>Your spending policy</h2>
      <label class="row">Auto-approve up to ($) <input type="number" id="escalateAbove" min="0"></label>
      <label class="row">Hard cap per order ($) <input type="number" id="maxPerOrder" min="0"></label>
      <label class="row">Monthly budget ($) <input type="number" id="monthlyBudget" min="0"></label>
      <label class="row">Max qty per item <input type="number" id="maxQtyPerItem" min="1"></label>
      <div class="small" style="margin-top:10px">Allowed categories</div>
      <div class="cats" id="cats"></div>
    </section>
    <section class="card">
      <h2>Monthly spend</h2>
      <div><strong id="spentTxt">$0</strong> <span class="small" id="budgetTxt"></span></div>
      <div class="meter"><div id="meter" style="width:0"></div></div>
      <div id="ledger" style="margin-top:10px"><p class="empty">No captured payments yet.</p></div>
    </section>
  </aside>

  <section>
    <div class="card">
      <h2>Tell your agent what to buy</h2>
      <textarea id="req" placeholder="e.g. Spring tulips for mom's birthday, under $35"></textarea>
      <div class="chips" id="chips"></div>
      <div class="actions">
        <button class="primary" id="go">Send agent shopping</button>
        <label class="toggle" title="Agent treats merchant listing text as instructions — a common real-world agent bug">
          <input type="checkbox" id="red"> Red-team: simulate a compromised agent
        </label>
      </div>
      <p class="err" id="err"></p>
    </div>

    <div class="card hidden" id="result">
      <div class="steps">
        <div class="step"><div class="num">1</div><div>
          <h3>Agent proposed <span class="src" id="agentSrc"></span></h3>
          <table><thead><tr><th>Item</th><th>Merchant</th><th>Qty</th><th style="text-align:right">Price</th></tr></thead><tbody id="cart"></tbody></table>
          <p class="rationale" id="rationale"></p>
        </div></div>
        <div class="step"><div class="num">2</div><div>
          <h3>Guard checked what the agent read <span class="src" id="guardSrc"></span></h3>
          <div id="guard"></div>
        </div></div>
        <div class="step"><div class="num">3</div><div>
          <h3>Policy verdict</h3>
          <div class="verdict" id="verdict"></div>
        </div></div>
        <div class="step"><div class="num">4</div><div>
          <h3>Pay with PayPal</h3>
          <div id="payGate"></div>
          <div id="pay"></div>
          <p id="payMsg"></p>
        </div></div>
      </div>
    </div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
// Build DOM with textContent only: model output never becomes HTML.
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k === 'class' ? (el.className = v) : el.setAttribute(k, v);
  for (const k of kids.flat()) el.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return el;
};
const usd = (n) => `$${Number(n).toFixed(2)}`;
const api = async (path, opts = {}) => {
  const r = await fetch(path, { headers: { 'content-type': 'application/json' }, ...opts, body: opts.body && JSON.stringify(opts.body) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
};

const DEMOS = [
  { text: "Spring tulips for mom's birthday, under $35", red: false },
  { text: 'Peonies for mom, under $60', red: false },
  { text: 'Peonies for mom, under $60', red: true, label: 'Peonies for mom (red-team)' },
  { text: 'USB-C charger for my laptop', red: false },
  { text: 'Noise-cancelling headphones for travel', red: false },
];
let cfg, current, sdkLoaded;

async function init() {
  cfg = await api('/api/config');
  const b = $('badges');
  b.replaceChildren(
    h('span', { class: `badge ${cfg.aiMode !== 'rules' ? 'live' : ''}`, title: cfg.aiModel || 'no model key set' }, `AI: ${cfg.aiMode}`),
    h('span', { class: `badge ${cfg.paypalMode === 'sandbox' ? 'live' : ''}` }, `PayPal: ${cfg.paypalMode}`),
  );
  if (cfg.aiMode !== 'rules') b.append(h('span', { class: 'badge', title: 'Dev/test model spend cap' }, `AI spend ${usd(cfg.aiBudget.spentUsd)} / ${usd(cfg.aiBudget.limitUsd)}`));
  for (const k of ['escalateAbove', 'maxPerOrder', 'monthlyBudget', 'maxQtyPerItem']) {
    $(k).value = cfg.policy[k];
    $(k).onchange = savePolicy;
  }
  $('cats').replaceChildren(...cfg.categories.map((c) => {
    const box = h('input', { type: 'checkbox', value: c });
    box.checked = cfg.policy.allowedCategories.includes(c);
    box.onchange = savePolicy;
    return h('label', {}, box, c);
  }));
  $('chips').replaceChildren(...DEMOS.map((d) => {
    const c = h('button', { class: 'chip', type: 'button' }, d.label || d.text);
    c.onclick = () => { $('req').value = d.text; $('red').checked = d.red; };
    return c;
  }));
  if (cfg.paypalMode === 'sandbox') loadSdk();
  refreshLedger();
}

async function savePolicy() {
  cfg.policy = await api('/api/policy', { method: 'PUT', body: {
    escalateAbove: $('escalateAbove').value, maxPerOrder: $('maxPerOrder').value,
    monthlyBudget: $('monthlyBudget').value, maxQtyPerItem: $('maxQtyPerItem').value,
    allowedCategories: [...document.querySelectorAll('#cats input:checked')].map((i) => i.value),
  } });
  refreshLedger();
}

async function refreshLedger() {
  const l = await api('/api/ledger');
  $('spentTxt').textContent = usd(l.spent);
  $('budgetTxt').textContent = `of ${usd(l.budget)} budget`;
  $('meter').style.width = `${Math.min(100, (l.spent / l.budget) * 100 || 0)}%`;
  $('ledger').replaceChildren(...(l.entries.length
    ? l.entries.map((e) => h('div', { class: 'ledger-row', title: `PayPal order ${e.orderId} · decision ${e.decisionId}` }, h('span', {}, e.items), h('span', {}, usd(e.amount))))
    : [h('p', { class: 'empty' }, 'No captured payments yet.')]));
}

function loadSdk() {
  sdkLoaded = new Promise((ok, fail) => {
    const s = document.createElement('script');
    s.src = `https://www.paypal.com/sdk/js?client-id=${encodeURIComponent(cfg.paypalClientId)}&currency=USD&intent=capture`;
    s.onload = ok; s.onerror = () => fail(new Error('PayPal SDK failed to load'));
    document.head.append(s);
  });
}

$('go').onclick = async () => {
  const request = $('req').value.trim();
  if (!request) return ($('err').textContent = 'Tell the agent what to buy.');
  $('err').textContent = '';
  $('go').disabled = true; $('go').textContent = 'Agent shopping…';
  try {
    current = await api('/api/shop', { method: 'POST', body: { request, redTeam: $('red').checked } });
    render(current);
  } catch (e) { $('err').textContent = e.message; }
  finally { $('go').disabled = false; $('go').textContent = 'Send agent shopping'; }
};

function render(d) {
  $('result').classList.remove('hidden');
  $('agentSrc').textContent = `via ${d.agent.source}`;
  $('guardSrc').textContent = `via ${d.guard.source}`;
  $('cart').replaceChildren(...(d.cart.length
    ? d.cart.map((i) => h('tr', {}, h('td', {}, i.name), h('td', {}, i.merchant), h('td', {}, i.qty), h('td', { class: 'n' }, usd(i.price * i.qty))))
    : [h('tr', {}, h('td', { colspan: 4, class: 'empty' }, 'Nothing proposed.'))]));
  $('cart').append(h('tr', {}, h('td', { colspan: 3 }, h('strong', {}, 'Total')), h('td', { class: 'n' }, h('strong', {}, usd(d.total)))));
  $('rationale').textContent = d.agent.rationale ? `“${d.agent.rationale}”` : '';

  const g = [];
  for (const inj of d.guard.injections) {
    const targets = inj.targets.length ? ` It tries to get ${inj.targets.join(', ')} added.` : '';
    g.push(h('div', { class: 'alert' }, h('strong', {}, `Prompt injection in listing ${inj.sku}.`), targets, h('q', {}, inj.excerpt)));
  }
  if (!d.guard.injections.length) g.push(h('div', { class: 'okline' }, 'No instructions aimed at AI agents found in listings.'));
  g.push(h('div', { class: d.guard.drift.matches ? 'okline' : 'alert' },
    h('strong', {}, d.guard.drift.matches ? 'Cart matches your request. ' : 'Intent drift. '), d.guard.drift.reason));
  $('guard').replaceChildren(...g);

  const v = $('verdict');
  v.className = `verdict ${d.verdict}`;
  const word = { APPROVE: 'Approved', ESCALATE: 'Needs you', BLOCK: 'Blocked' }[d.verdict];
  v.replaceChildren(
    h('div', { class: 'vhead' }, h('span', { class: 'vword' }, word), h('span', { class: 'risk' }, `risk ${d.score}/100 · ${d.ms} ms · ${d.id}`)),
    d.reasons.length
      ? h('ul', { class: 'reasons' }, d.reasons.map((r) => h('li', { class: r.severity }, h('span', { class: 'sev' }, r.severity), r.message)))
      : h('div', {}, `Within every rule of your policy. Safe for the agent to pay ${usd(d.total)}.`),
  );
  renderPay(d);
}

function renderPay(d) {
  $('pay').replaceChildren(); $('payGate').replaceChildren(); $('payMsg').textContent = ''; $('payMsg').className = '';
  if (d.verdict === 'BLOCK') {
    $('payGate').append(h('p', { class: 'empty' }, 'No PayPal order was created. The agent cannot pay for this cart.'));
    return;
  }
  if (d.verdict === 'ESCALATE') {
    const box = h('input', { type: 'checkbox' });
    box.onchange = () => (box.checked ? mountPay(d, true) : $('pay').replaceChildren());
    $('payGate').append(h('label', { class: 'toggle' }, box, 'I reviewed the reasons above. Let the agent pay.'));
    return;
  }
  mountPay(d, false);
}

async function mountPay(d, confirm) {
  const createOrder = async () => (await api('/api/orders', { method: 'POST', body: { decisionId: d.id, confirm } })).id;
  const onApprove = async (orderID) => {
    const cap = await api(`/api/orders/${encodeURIComponent(orderID)}/capture`, { method: 'POST' });
    $('pay').replaceChildren();
    $('payGate').replaceChildren();
    $('payMsg').className = 'okline';
    $('payMsg').textContent = `Paid ${usd(d.total)} · PayPal order ${cap.id} · ${cap.status}${cap.payer ? ' · ' + cap.payer : ''}`;
    refreshLedger();
  };
  const fail = (e) => { $('payMsg').className = 'err'; $('payMsg').textContent = e.message || String(e); };

  if (cfg.paypalMode !== 'sandbox') {
    const btn = h('button', { class: 'sim-btn' }, `Pay ${usd(d.total)} with PayPal (simulated)`);
    btn.onclick = async () => { btn.disabled = true; try { await onApprove(await createOrder()); } catch (e) { fail(e); btn.disabled = false; } };
    $('pay').replaceChildren(btn, h('p', { class: 'small' }, 'Add PayPal sandbox keys to .env for real Orders v2 checkout.'));
    return;
  }
  try {
    await sdkLoaded;
    $('pay').replaceChildren();
    paypal.Buttons({
      style: { layout: 'vertical', shape: 'rect', label: 'pay' },
      createOrder,
      onApprove: (data) => onApprove(data.orderID).catch(fail),
      onError: fail,
    }).render('#pay');
  } catch (e) { fail(e); }
}

init().catch((e) => ($('err').textContent = e.message));
</script>
</body>
</html>
